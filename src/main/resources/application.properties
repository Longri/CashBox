spring.application.name=cashbox
server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Browser beim Start im Entwicklungsmodus öffnen
vaadin.launch-browser=true

# Datenbank (lokale MariaDB aus LocalDB/docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/cashbox?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:cashbox}
spring.datasource.password=${DB_PASSWORD:cashbox}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Schema per Flyway (src/main/resources/db/migration). Eine Datenbank, die schon vor Flyway
# angelegt wurde (altes init-Skript), wird als Stand V1 übernommen statt neu angelegt.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Admin-Account aus .env (Projektwurzel) bzw. Umgebungsvariablen - wird NICHT in der DB gespeichert
spring.config.import=optional:file:.env[.properties]
cashbox.admin.username=${ADMIN_USER:}
cashbox.admin.password=${ADMIN_PASSWORD:}

# Angemeldet bleiben: Laufzeit des Remember-Me-Cookies in Tagen (.env: REMEMBER_ME_DAYS, 0 = aus)
cashbox.remember-me.days=${REMEMBER_ME_DAYS:14}
